<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Journey — A Gecko's Tale</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The 3D world lives here, fixed behind everything -->
  <canvas id="scene"></canvas>

  <!-- Loading veil -->
  <div id="loader"><div class="leaf-spin"></div><span>Entering the rainforest…</span></div>

  <!-- HTML overlays that float over the 3D scene -->
  <div id="ui">
    <!-- Screen 1 title -->
    <div id="intro" class="overlay center">
      <h1>The Journey Starts</h1>
      <p class="sub">Scroll to Begin the Journey</p>
      <div class="scroll-hint"><span></span></div>
    </div>

    <!-- Floating section captions (subtle narration, no page jumps) -->
    <div id="caption" class="overlay caption"></div>

    <!-- Screen 5 end note -->
    <div id="ending" class="overlay center bottom">
      <h2>Journey Complete</h2>
      <p class="sub">Pick a path — tap a tile and the gecko will claim it.</p>
    </div>
  </div>

  <!-- This tall element gives the page its scroll length -->
  <div id="scroller"></div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
